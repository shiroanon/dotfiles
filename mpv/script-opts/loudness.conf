# Loudness normalisation (scripts/loudness.lua)
#
# Constant-gain normalisation: one measured offset per file, no dynamic
# compression. See the script header for the full explanation.

# On by default. Toggle at runtime with Alt+n (input.conf).
enabled=yes

# Integrated loudness target, in LUFS. -16 suits film/TV and mixed listening;
# -18 is a little quieter, -23 is broadcast.
target=-16

# True-peak ceiling. Gain is reduced automatically so nothing clips.
# Keep a little headroom: lossy codecs can overshoot the sample peaks.
true_peak=-1.5

# Safety clamps on the applied gain (dB).
max_boost=20
max_cut=-30

# Measurement slices. Long files are probed with `windows` slices of
# `window_len` seconds instead of being decoded whole - 6 x 4 s is under a
# second of CPU even for a 2-hour film. Raise both for more accuracy on
# wildly dynamic material, lower them for speed.
windows=6
window_len=4

###########
# General #
###########
input-ipc-server=/tmp/mpvsocket
reset-on-next-file=none

# Window sizing. mpv fits each video inside this box itself, so the window
# follows the video's aspect (16:9 -> 400x225, 9:16 -> 225x400) the instant
# a new file decodes, with no compositor round-trip and no resize fight.
# Set here rather than only in the window manager so EVERY mpv instance
# self-sizes, including ones the daemon cannot tie to the IPC socket.
autofit=400x400

# Video Output & Hardware Acceleration
# 'auto' lets mpv select waylandegl cleanly; opengl keeps Intel stable.
vo=gpu
gpu-api=opengl
gpu-context=auto

# Forces VA-API decoding on the Intel UHD 620 iGPU (keeps MX250 asleep)
hwdec=vaapi

# Performance & Frame Handling
framedrop=vo


######
# UI #
######
border=no
msg-color=yes
term-osd-bar=no
cursor-autohide=1000

############
# Playback #
############
# Prevents CPU audio-resampling loops and thermal throttling
video-sync=audio
interpolation=no
deinterlace=no

#########
# Audio #
#########
# Per-file loudness normalisation lives in scripts/loudness.lua: it applies
# one constant gain (measured once by ffmpeg, then cached), never dynamic
# compression, so dynamics and transients are untouched.
#
# Files that already carry ReplayGain tags are normalised losslessly by mpv
# itself; the script detects those and steps aside, so gain is never doubled.
replaygain=track
replaygain-preamp=0
replaygain-clip=yes
#
# mpv's downmix normaliser divides by the channel count, which quietly
# attenuates (and changes the level of) every stereo->mono / 5.1 downmix.
# Off = bit-transparent downmixing.
audio-normalize-downmix=no

##############
# Colorspace #
##############
target-prim=auto
target-trc=auto
video-output-levels=auto

##########
# Dither #
##########
# Saves GPU clock cycles on internal 6-bit/8-bit display panels
dither=no

#############
# Debanding #
#############
# Kept off to prevent unnecessary thermal load on 15W ULV chips
deband=no

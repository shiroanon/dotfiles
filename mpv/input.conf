# Mode A - Ultra Light
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/adaptive-sharpen.glsl:~~/shaders/CfL_Prediction_Lite.glsl:~~/shaders/Anime4K_Upscale_DTD_x2.glsl:~~/shaders/ArtCNN_C4F16.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_L.glsl"; show-text "Anime4K: Mode A (VL)"


# Clear
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Shaders Cleared"



# LUTs
k script-binding cycle-luts
K script-binding clear-lut

# Loudness normalisation on/off (scripts/loudness.lua)
Alt+n script-message toggle-loudness
